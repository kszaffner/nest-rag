<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brightwave RAG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Ask the Brightwave documents</h1>
      <p class="hint">
        Answers come only from the company documents (leave, remote work,
        expenses, IT). Ask in English.
      </p>

      <form id="question-form">
        <label for="question-input">Your question</label>
        <textarea
          id="question-input"
          rows="3"
          maxlength="2000"
          required
        ></textarea>
        <div class="form-row">
          <span id="character-counter" class="hint">0 / 2000</span>
          <button id="ask-button" type="submit">Ask</button>
        </div>
      </form>

      <section aria-label="Example questions">
        <h2>Examples</h2>
        <ul id="example-list" class="examples"></ul>
      </section>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="result" hidden>
        <h2>Answer</h2>
        <p id="answer"></p>
        <p id="warning" class="warning" hidden></p>
        <p id="details" class="hint"></p>
        <h2>Sources</h2>
        <ol id="source-list" class="sources"></ol>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
